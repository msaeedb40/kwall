apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kwall-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kwall
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kwall
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwall
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: kwall-agent
      hostNetwork: true
      hostPID: true
      containers:
        - name: kwall-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/kwall", "agent"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                - PERFMON
          volumeMounts:
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: kernel-debug
              mountPath: /sys/kernel/debug
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: run-kwall
              mountPath: /run/kwall
            - name: cni-bin
              mountPath: /opt/cni/bin
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: run-kwall
          hostPath:
            path: /run/kwall
            type: DirectoryOrCreate
        - name: cni-bin
          hostPath:
            path: {{ .Values.cni.binDir }}

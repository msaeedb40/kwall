name: KWALL Release & Supply Chain Security

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-sign:
    name: Build, SBOM Generation & Image Signing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Build Agent Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.agent
          push: false
          tags: ghcr.io/${{ github.repository }}/kwall-agent:${{ github.ref_name }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/kwall-agent:${{ github.ref_name }}
          format: spdx-json
          output-file: kwall-agent-sbom.spdx.json

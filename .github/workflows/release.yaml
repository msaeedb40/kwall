name: KWALL Release & Supply Chain Security

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-sign:
    name: Build Multi-Container Images, SBOMs & Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # 1. Agent Container
      - name: Build & Push kwall-agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.agent
          push: true
          tags: ghcr.io/${{ github.repository }}/kwall-agent:${{ github.ref_name }}

      # 2. Operator Container
      - name: Build & Push kwall-operator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.operator
          push: true
          tags: ghcr.io/${{ github.repository }}/kwall-operator:${{ github.ref_name }}

      # 3. API & GraphQL Gateway Container
      - name: Build & Push kwall-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/kwall-api:${{ github.ref_name }}

      # 4. Web Dashboard Container
      - name: Build & Push kwall-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.dashboard
          push: true
          tags: ghcr.io/${{ github.repository }}/kwall-dashboard:${{ github.ref_name }}

      # 5. SBOM Generation
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/kwall-agent:${{ github.ref_name }}
          format: spdx-json
          output-file: kwall-agent-sbom.spdx.json

      # 6. Helm Chart Packaging & OCI Push
      - name: Package & Push Helm Chart
        run: |
          helm package deployments/helm/kwall --version ${{ github.ref_name }} --app-version ${{ github.ref_name }}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          helm push kwall-${{ github.ref_name }}.tgz oci://ghcr.io/${{ github.repository }}/charts

name: KWALL CI

on:
  push:
    branches: [main, mybuild]
  pull_request:
    branches: [main, mybuild]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --exclude kwall-ebpf --all-targets

      - name: Clippy lint
        run: cargo clippy --workspace --exclude kwall-ebpf --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --exclude kwall-ebpf --all-features

  ui:
    name: Build & Verify UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: kwall-ui/package-lock.json

      - name: Install dependencies
        working-directory: kwall-ui
        run: npm ci

      - name: Build UI
        working-directory: kwall-ui
        run: npm run build

      - name: Run UI tests
        working-directory: kwall-ui
        run: npm test -- --watch=false

  ebpf:
    name: Build & Conformance Check eBPF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        uses: taiki-e/install-action@bpf-linker

      - name: Build eBPF programs (release)
        run: |
          cargo +nightly build \
            -Z build-std=core \
            -p kwall-ebpf \
            --release \
            --target bpfel-unknown-none

      - name: Run eBPF Conformance & Verifier Checks
        run: cargo test -p kwall-dataplane --lib verifier::tests::test_verify_real_kwall_ebpf_binary

      - name: Inspect eBPF ELF binary
        run: |
          file target/bpfel-unknown-none/release/kwall-ebpf
          readelf -S target/bpfel-unknown-none/release/kwall-ebpf


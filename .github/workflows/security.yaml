name: KWALL Security & Vulnerability Audit

on:
  push:
    branches: [ "main", "works" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly security scan on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  cargo-audit:
    name: Rust Crates Security Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run Cargo Audit
        # Audit for known vulnerabilities in dependencies
        # Use --ignore to suppress specific non-actionable advisories if needed
        run: cargo audit --deny warnings 2>&1 || true

      - name: Run Cargo Audit (Strict)
        # Informational: fail only on critical/high severity
        continue-on-error: true
        run: cargo audit

  secret-detection:
    name: Hardcoded Secrets & Credentials Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1

      - name: Upload Gitleaks Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  dependency-review:
    name: Dependency License & Supply Chain Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0

name: KWALL Security & Vulnerability Audit

on:
  push:
    branches: [ "main","works" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly security scan on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  cargo-audit:
    name: Rust Crates Security Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secret-detection:
    name: Hardcoded Secrets & Credentials Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

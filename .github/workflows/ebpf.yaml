name: KWALL eBPF Build & Verification

on:
  push:
    branches: [main, mybuild]
  pull_request:
    branches: [main, mybuild]
    paths:
      - 'crates/kwall-ebpf/**'
      - 'crates/kwall-ebpf-common/**'
      - '.cargo/**'
      - '.github/workflows/ebpf.yaml'
  

jobs:
  ebpf:
    name: Build eBPF Bytecode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        uses: taiki-e/install-action@bpf-linker

      - name: Build eBPF programs
        run: |
          cargo +nightly build \
            -Z build-std=core \
            -p kwall-ebpf \
            --release \
            --target bpfel-unknown-none

      - name: Run eBPF Conformance & Verifier Checks
        run: cargo test -p kwall-dataplane --lib verifier::tests::test_verify_real_kwall_ebpf_binary

      - name: Upload eBPF Bytecode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwall-ebpf-bytecode
          path: target/bpfel-unknown-none/release/kwall-ebpf


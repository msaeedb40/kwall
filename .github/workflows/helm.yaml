name: KWALL Helm Chart Verification

on:
  push:
    branches: [ "main", "works" ]
    paths:
      - "deployments/helm/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "deployments/helm/**"

jobs:
  helm-lint:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.0

      - name: Helm Lint
        run: helm lint deployments/helm/kwall

      - name: Helm Template Dry-Run
        run: |
          helm template kwall deployments/helm/kwall \
            --namespace kwall-system \
            --set api.enabled=true \
            --set dashboard.enabled=true \
            --set gatewayApi.enabled=true

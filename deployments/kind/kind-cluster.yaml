# Kubernetes-in-Docker (KinD) 3-Node Cluster Configuration
# 1 Control-Plane Node and 2 Worker Nodes with eBPF and BTF Host Passthrough
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kwall-cluster
networking:
  ipFamily: ipv4
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  disableDefaultCNI: false

nodes:
  # -------------------------------------------------------------
  # Control Plane Node
  # -------------------------------------------------------------
  - role: control-plane
    image: kindest/node:v1.32.0
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            enable-admission-plugins: "NodeRestriction,ValidatingAdmissionWebhook"
    extraPortMappings:
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
    extraMounts:
      - hostPath: /sys/kernel/btf
        containerPath: /sys/kernel/btf
        readOnly: true
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
      - hostPath: /sys/fs/cgroup
        containerPath: /sys/fs/cgroup
        readOnly: false
      - hostPath: /proc
        containerPath: /host/proc
        readOnly: true
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true

  # -------------------------------------------------------------
  # Worker Node 1
  # -------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.32.0
    extraMounts:
      - hostPath: /sys/kernel/btf
        containerPath: /sys/kernel/btf
        readOnly: true
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
      - hostPath: /sys/fs/cgroup
        containerPath: /sys/fs/cgroup
        readOnly: false
      - hostPath: /proc
        containerPath: /host/proc
        readOnly: true
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true

  # -------------------------------------------------------------
  # Worker Node 2
  # -------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.32.0
    extraMounts:
      - hostPath: /sys/kernel/btf
        containerPath: /sys/kernel/btf
        readOnly: true
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        propagation: Bidirectional
      - hostPath: /sys/fs/cgroup
        containerPath: /sys/fs/cgroup
        readOnly: false
      - hostPath: /proc
        containerPath: /host/proc
        readOnly: true
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true

{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: kwall-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kwall-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kwall
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: kwall-dashboard
{{- end }}

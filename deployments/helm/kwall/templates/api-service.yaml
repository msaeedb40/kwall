{{- if .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: kwall-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kwall-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kwall
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: kwall-api
{{- end }}

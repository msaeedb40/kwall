{{- if .Values.agent.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kwall-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kwall-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kwall
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kwall-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwall-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: kwall-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: {{ .Values.agent.securityContext.privileged }}
            readOnlyRootFilesystem: {{ .Values.agent.securityContext.readOnlyRootFilesystem }}
            runAsUser: {{ .Values.agent.securityContext.runAsUser }}
            runAsGroup: {{ .Values.agent.securityContext.runAsGroup }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KWALL_FAIL_MODE
              value: {{ .Values.agent.failMode | quote }}
            - name: KWALL_RING_BUFFER_SIZE
              value: {{ .Values.agent.ringBufferSize | quote }}
            - name: KWALL_LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            - name: KWALL_LOG_FORMAT
              value: {{ .Values.agent.logFormat | quote }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: sys-kernel-btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: host-proc
              mountPath: /proc
              readOnly: true
      volumes:
        - name: sys-kernel-btf
          hostPath:
            path: {{ .Values.agent.hostMounts.btfPath }}
        - name: sys-fs-bpf
          hostPath:
            path: {{ .Values.agent.hostMounts.bpfFsPath }}
        - name: sys-fs-cgroup
          hostPath:
            path: {{ .Values.agent.hostMounts.cgroupPath }}
        - name: host-proc
          hostPath:
            path: {{ .Values.agent.hostMounts.procPath }}
{{- end }}

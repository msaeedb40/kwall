{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwall-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kwall-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kwall
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kwall-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwall-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: kwall-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.api.logLevel | quote }}
            - name: KWALL_PORT
              value: {{ .Values.api.service.port | quote }}
            - name: KWALL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.auth.secretName }}
                  key: auth-secret
                  optional: true
            - name: OIDC_ISSUER_URL
              value: {{ .Values.api.auth.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.api.auth.oidc.clientId | quote }}
          livenessProbe:
            httpGet:
              path: /api/v1/clusters
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/clusters
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
